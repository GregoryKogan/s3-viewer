[package]
name = "s3viewer"
version = "0.1.0"
description = "Minimal S3 browser with rich in-app preview"
edition = "2021"
rust-version = "1.77"
license = "MIT"

[lib]
name = "s3viewer_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "s3viewer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"

aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = "1"
aws-smithy-types = "1"
aws-smithy-runtime-api = "1"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"

# local credential encryption (XChaCha20-Poly1305) + OS keychain master key
chacha20poly1305 = "0.10"
rand = "0.8"
base64 = "0.22"
zeroize = { version = "1", features = ["derive"] }
keyring = { version = "3", features = ["apple-native", "sync-secret-service", "crypto-rust"] }
httpdate = "1"

# Parquet preview: the low-level API avoids pulling in arrow (and its
# multi-minute build) just to show a table.
parquet = { version = "55", default-features = false, features = ["snap", "flate2", "lz4", "zstd"] }

# SigV2 (legacy) fallback signer
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
quick-xml = "0.37"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-native-roots",
    "stream",
    "http2",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
# Only tests need to *write* Parquet files; the app only reads them.
parquet = { version = "55", default-features = false, features = ["arrow", "snap", "flate2", "lz4", "zstd"] }
arrow = { version = "55", features = ["prettyprint"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
