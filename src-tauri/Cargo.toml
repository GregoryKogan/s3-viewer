[package]
name = "s3viewer"
version = "0.3.2"
description = "Minimal S3 browser with rich in-app preview"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[lib]
name = "s3viewer_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
# Restores the window's size and position between launches (PLT-1).
tauri-plugin-window-state = "2"

aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = "1"
aws-smithy-types = "1"
# Lets the S3 client be built with explicit connection-pool behaviour. The
# default pool kept idle keep-alive sockets alive indefinitely, and a stale one
# turned the next request into a multi-second stall.
aws-smithy-http-client = { version = "1", features = ["default-client", "rustls-aws-lc"] }
aws-smithy-runtime-api = "1"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"

# local credential encryption (XChaCha20-Poly1305) + OS keychain master key
chacha20poly1305 = "0.10"
rand = "0.8"
base64 = "0.22"
keyring = { version = "3", features = ["apple-native", "sync-secret-service", "crypto-rust"] }

# Parquet preview: the low-level API avoids pulling in arrow (and its
# multi-minute build) just to show a table.
parquet = { version = "55", default-features = false, features = ["snap", "flate2", "lz4", "zstd"] }

# SigV2 (legacy) fallback signer
hmac = "0.12"
sha1 = "0.10"
quick-xml = "0.37"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-native-roots",
    "stream",
    "http2",
] }
# Auto-updates. Every downloaded bundle is checked against the minisign public
# key in `tauri.conf.json`; a build made without a signing key still runs, it
# just never sees an update. See AGENTS.md before touching the version or the
# release workflow.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[dev-dependencies]
tempfile = "3"
# Only tests need to *write* Parquet files; the app only reads them.
parquet = { version = "55", default-features = false, features = ["arrow", "snap", "flate2", "lz4", "zstd"] }
arrow = { version = "55", features = ["prettyprint"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
