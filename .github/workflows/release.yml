name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One macOS download for both architectures: the landing page links to a
          # single file, and Intel Macs still exist.
          - name: macOS (universal)
            os: macos-14
            target: universal-apple-darwin
            bundles: dmg,app
            artifact: macos
          # 22.04 is the practical baseline for an installable .deb.
          - name: Linux (x86_64)
            os: ubuntu-22.04
            target: ""
            bundles: deb,appimage
            artifact: linux

    steps:
      - uses: actions/checkout@v4

      # The updater only compares version numbers, so a tag that disagrees with
      # `tauri.conf.json` makes every installed copy offer the same update again
      # on every launch. Fail here instead of shipping that.
      - name: The tag must match the version in tauri.conf.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json;print(json.load(open("src-tauri/tauri.conf.json"))["version"])')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match tauri.conf.json ($version)."
            exit 1
          fi

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libsecret-1-dev \
            patchelf \
            file \
            wget

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      # A universal binary needs both slices, so the Intel target is added
      # explicitly on the arm64 runner.
      - name: Add the Intel target
        if: matrix.target == 'universal-apple-darwin'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.artifact }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the webview bundle
        run: pnpm build:frontend

      - name: Run the Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Includes the check that the three version files agree.
      - name: Run the JS tests
        run: pnpm test:js

      # An unset secret still arrives as an empty string, and Tauri treats "the
      # variable exists" as "sign with it" — which failed with an unhelpful
      # "the password must match the one used to export it". The variables are
      # therefore copied into the job environment only when they carry a value.
      - name: Prepare signing
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CERTIFICATE:-}" ]; then
            echo "No APPLE_CERTIFICATE secret: building an unsigned app."
            echo "macOS will ask the user to allow it once; this is documented on the site."
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE=$CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY"
            echo "APPLE_ID=$NOTARY_APPLE_ID"
            echo "APPLE_PASSWORD=$NOTARY_PASSWORD"
            echo "APPLE_TEAM_ID=$NOTARY_TEAM_ID"
          } >> "$GITHUB_ENV"
          echo "Signing and notarisation are configured."

      - name: Build the application
        shell: bash
        env:
          # Stops the macOS bundler from asking Finder to arrange the disk image,
          # which needs Automation permission and times out on a build runner.
          CI: "true"
          # Signing key for the updater bundles. Never committed, never needed
          # locally: `createUpdaterArtifacts` is switched on only from here.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          config='{"bundle":{"createUpdaterArtifacts":true}}'
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set, so the release would not be installable as an update."
              exit 1
            fi
            echo "::warning::No signing key: building without updater artifacts."
            config='{}'
          fi
          args="--bundles ${{ matrix.bundles }}"
          if [ -n "${{ matrix.target }}" ]; then args="--target ${{ matrix.target }} $args"; fi
          pnpm tauri build $args --config "$config"

      # Asset names are fixed so that `releases/latest/download/<name>` — which is
      # what the landing page links to and what `latest.json` points at — keeps
      # working across versions. `.github/scripts/latest-json.mjs` expects these
      # exact names.
      - name: Collect installers under stable names
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          base="src-tauri/target"
          if [ -n "${{ matrix.target }}" ]; then base="$base/${{ matrix.target }}"; fi
          base="$base/release/bundle"

          copy_first() {
            if [ -d "$1" ]; then
              find "$1" -type f -name "$2" -exec cp {} "$3" \;
            fi
          }

          copy_first "$base/dmg" '*.dmg' release-assets/S3-Viewer.dmg
          copy_first "$base/macos" '*.app.tar.gz' release-assets/S3-Viewer.app.tar.gz
          copy_first "$base/macos" '*.app.tar.gz.sig' release-assets/S3-Viewer.app.tar.gz.sig
          copy_first "$base/appimage" '*.AppImage' release-assets/S3-Viewer.AppImage
          copy_first "$base/appimage" '*.AppImage.sig' release-assets/S3-Viewer.AppImage.sig
          copy_first "$base/deb" '*.deb' release-assets/S3-Viewer-amd64.deb

          # The bundler signs the .app and the AppImage but not the .deb, while
          # the updater verifies whatever it installs. Sign it here with the same
          # key so Debian installs update too (through `pkexec dpkg -i`).
          if [ -f release-assets/S3-Viewer-amd64.deb ]; then
            pnpm tauri signer sign release-assets/S3-Viewer-amd64.deb
          fi

          ls -lh release-assets
          if [ -z "$(ls -A release-assets)" ]; then
            echo "no installer was produced" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.artifact }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    # A manual run has no tag to publish under.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # The running app fetches this file through
      # `releases/latest/download/latest.json`; it lists every platform with the
      # signature of its bundle. Assets are uploaded in the same step as the
      # release below, so `latest` and the manifest always agree.
      - name: Write the updater manifest
        env:
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          node .github/scripts/latest-json.mjs \
            --assets release-assets \
            --version "${TAG#v}" \
            --base-url "https://github.com/${GH_REPO}/releases/latest/download" \
            --out release-assets/latest.json
          cat release-assets/latest.json

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release-assets/* \
            --title "S3 Viewer ${TAG#v}" \
            --generate-notes \
            --verify-tag
