name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One macOS download for both architectures: the landing page links to a
          # single file, and Intel Macs still exist.
          - name: macOS (universal)
            os: macos-14
            target: universal-apple-darwin
            bundles: dmg,app
            artifact: macos
          # 22.04 is the practical baseline for an installable .deb.
          - name: Linux (x86_64)
            os: ubuntu-22.04
            target: ""
            bundles: deb,appimage
            artifact: linux

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libsecret-1-dev \
            patchelf \
            file \
            wget

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      # A universal binary needs both slices, so the Intel target is added
      # explicitly on the arm64 runner.
      - name: Add the Intel target
        if: matrix.target == 'universal-apple-darwin'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.artifact }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the webview bundle
        run: pnpm build:frontend

      - name: Run the Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # An unset secret still arrives as an empty string, and Tauri treats "the
      # variable exists" as "sign with it" — which failed with an unhelpful
      # "the password must match the one used to export it". The variables are
      # therefore copied into the job environment only when they carry a value.
      - name: Prepare signing
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CERTIFICATE:-}" ]; then
            echo "No APPLE_CERTIFICATE secret: building an unsigned app."
            echo "macOS will ask the user to allow it once; this is documented on the site."
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE=$CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY"
            echo "APPLE_ID=$NOTARY_APPLE_ID"
            echo "APPLE_PASSWORD=$NOTARY_PASSWORD"
            echo "APPLE_TEAM_ID=$NOTARY_TEAM_ID"
          } >> "$GITHUB_ENV"
          echo "Signing and notarisation are configured."

      - name: Build the application
        env:
          # Stops the macOS bundler from asking Finder to arrange the disk image,
          # which needs Automation permission and times out on a build runner.
          CI: "true"
        run: |
          args="--bundles ${{ matrix.bundles }}"
          if [ -n "${{ matrix.target }}" ]; then args="--target ${{ matrix.target }} $args"; fi
          pnpm tauri build $args

      # Asset names are fixed so that `releases/latest/download/<name>` — which is
      # what the landing page links to — keeps working across versions.
      - name: Collect installers under stable names
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          base="src-tauri/target"
          if [ -n "${{ matrix.target }}" ]; then base="$base/${{ matrix.target }}"; fi
          base="$base/release/bundle"
          find "$base" -type f -name '*.dmg' -exec cp {} dist/S3-Viewer.dmg \;
          find "$base" -type f -name '*.AppImage' -exec cp {} dist/S3-Viewer.AppImage \;
          find "$base" -type f -name '*.deb' -exec cp {} dist/S3-Viewer-amd64.deb \;
          ls -lh dist
          if [ -z "$(ls -A dist)" ]; then
            echo "no installer was produced" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    # A manual run has no tag to publish under.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --title "S3 Viewer ${TAG#v}" \
            --generate-notes \
            --verify-tag
