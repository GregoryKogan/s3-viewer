name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon. Intel users can build locally with the same command.
          - name: macOS (arm64)
            os: macos-14
            args: --bundles dmg,app
            artifact: s3viewer-macos-arm64
          # 22.04 is the practical baseline for an installable .deb.
          - name: Linux (x86_64)
            os: ubuntu-22.04
            args: --bundles deb,appimage
            artifact: s3viewer-linux-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libsecret-1-dev \
            patchelf \
            file \
            wget

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the webview bundle
        run: pnpm build:frontend --minify

      - name: Run the Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build the application
        run: pnpm tauri build ${{ matrix.args }}

      - name: Collect the installers
        shell: bash
        run: |
          mkdir -p artifacts
          find src-tauri/target/release/bundle -type f \
            \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) \
            -exec cp {} artifacts/ \;
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/*
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
          generate_release_notes: true
